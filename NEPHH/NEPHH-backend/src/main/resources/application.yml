server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:./.local-database.yml,optional:file:./.local-huawei-iot.yml
  application:
    name: nephh-backend
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
app:
  huawei-iot:
    enabled: ${HUAWEI_IOT_ENABLED:false}
    endpoint: ${HUAWEI_IOT_ENDPOINT:}
    project-id: ${HUAWEI_IOT_PROJECT_ID:}
    instance-id: ${HUAWEI_IOT_INSTANCE_ID:}
    auth-token: ${HUAWEI_IOT_AUTH_TOKEN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  jwt:
    secret: ${JWT_SECRET}
    issuer: nephh-backend
